<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Chat window answering a question, with OpenAI and local fallback modes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs><rect width="1000" height="360" rx="18" fill="#070914"/><text x="500.0" y="28" text-anchor="middle" font-size="11" letter-spacing="8" fill="#7c8db5" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">THE CO-PILOT · TWO WAYS TO ANSWER</text><rect x="40" y="50" width="520" height="290" rx="14" transform="translate(7,9)" fill="#818cf8" opacity="0.2"/><rect x="40" y="50" width="520" height="290" rx="14" fill="#0f1530" stroke="#818cf8" stroke-width="2"/><text x="64" y="80" font-size="11" font-weight="800" fill="#c7d2fe" letter-spacing="3" font-family="Segoe UI, Helvetica, Arial, sans-serif">CO-PILOT</text><text x="536" y="80" text-anchor="end" font-size="10" fill="#64748b" letter-spacing="3" font-family="Segoe UI, Helvetica, Arial, sans-serif">SAMPLE CHAT</text><rect x="230" y="96" width="290" height="40" rx="14" fill="#818cf8" fill-opacity="0.28" stroke="#818cf8"/><text x="244" y="121" font-size="12.5" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif">How do I strengthen my projects section?</text>
<clipPath id="cp"><rect x="64" y="160" width="0" height="80"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.12;0.4;0.92;1" values="0;0;450;450;0"/></rect></clipPath>
<rect x="60" y="152" width="460" height="104" rx="14" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.101;0.92;0.921;1" values="0;0;1;1;0;0"/></rect>
<g clip-path="url(#cp)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#e2e8f0"><text x="76" y="180">Lead with the outcome, name the tools you used,</text><text x="76" y="202">and link the code so a reader can verify it.</text><text x="76" y="224">Cut anything that doesn't back up the job's skills.</text></g>
<text x="76" y="246" font-size="10" letter-spacing="3" fill="#2dd4bf" font-weight="800" font-family="Segoe UI, Helvetica, Arial, sans-serif" opacity="0">VIA OPENAI<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.42;0.421;0.66;0.661;1" values="0;0;1;1;0;0"/></text><text x="76" y="246" font-size="10" letter-spacing="3" fill="#fbbf24" font-weight="800" font-family="Segoe UI, Helvetica, Arial, sans-serif" opacity="0">VIA LOCAL FALLBACK<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.68;0.681;0.92;0.921;1" values="0;0;1;1;0;0"/></text><rect x="580" y="56" width="380" height="120" rx="14" transform="translate(7,9)" fill="#2dd4bf" opacity="0.2"/><rect x="580" y="56" width="380" height="120" rx="14" fill="#0f1530" stroke="#2dd4bf" stroke-width="2"/><text x="602" y="86" font-size="11" font-weight="800" fill="#2dd4bf" letter-spacing="3" font-family="Segoe UI, Helvetica, Arial, sans-serif">WITH AN API KEY</text><text x="602" y="112" font-size="14" fill="#fff" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">OpenAI-backed assistant</text><text x="602" y="138" font-size="12" fill="#94a3b8" font-family="Consolas, Menlo, 'Courier New', monospace">OPENAI_API_KEY in backend/.env</text>
<rect x="580" y="56" width="380" height="120" rx="14" fill="none" stroke="#2dd4bf" stroke-width="4" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.101;0.4;0.401;1" values="0;0;1;1;0;0"/></rect>
<rect x="580" y="196" width="380" height="120" rx="14" transform="translate(7,9)" fill="#fbbf24" opacity="0.2"/><rect x="580" y="196" width="380" height="120" rx="14" fill="#0f1530" stroke="#fbbf24" stroke-width="2"/><text x="602" y="226" font-size="11" font-weight="800" fill="#fbbf24" letter-spacing="3" font-family="Segoe UI, Helvetica, Arial, sans-serif">WITHOUT A KEY</text><text x="602" y="252" font-size="14" fill="#fff" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">Local fallback answers</text><text x="602" y="278" font-size="12" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif">Covers common career questions, offline.</text>
<rect x="580" y="196" width="380" height="120" rx="14" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.62;0.621;0.92;0.921;1" values="0;0;1;1;0;0"/></rect></svg>