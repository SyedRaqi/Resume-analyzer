<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Animated flow: Upload, Analyze, Match, Advance" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1000" height="230" rx="18" fill="#070914"/>
  <path id="p" d="M125 105 H875" stroke="url(#line)" stroke-width="3" stroke-dasharray="6 8" fill="none">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/>
  </path>
  <circle r="7" fill="#fff"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
  <circle r="14" fill="#a78bfa" opacity="0.5" filter="url(#b)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- node template: shadow block gives 3D depth -->
    <g transform="translate(125,105)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" repeatCount="indefinite"/>
      <rect x="-70" y="-50" width="140" height="100" rx="14" transform="translate(8,10)" fill="#0891b2" opacity="0.45"/>
      <rect x="-70" y="-50" width="140" height="100" rx="14" fill="url(#card)" stroke="#22d3ee" stroke-width="1.5"/>
      <text y="-8" font-size="30" fill="#22d3ee">01</text><text y="22" font-size="17" font-weight="700" fill="#fff">UPLOAD</text><text y="40" font-size="12" fill="#94a3b8">PDF resume</text></g></g>
    <g transform="translate(375,105)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" begin="-0.75s" repeatCount="indefinite"/>
      <rect x="-70" y="-50" width="140" height="100" rx="14" transform="translate(8,10)" fill="#6366f1" opacity="0.45"/>
      <rect x="-70" y="-50" width="140" height="100" rx="14" fill="url(#card)" stroke="#818cf8" stroke-width="1.5"/>
      <text y="-8" font-size="30" fill="#818cf8">02</text><text y="22" font-size="17" font-weight="700" fill="#fff">ANALYZE</text><text y="40" font-size="12" fill="#94a3b8">component scores</text></g></g>
    <g transform="translate(625,105)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
      <rect x="-70" y="-50" width="140" height="100" rx="14" transform="translate(8,10)" fill="#8b5cf6" opacity="0.45"/>
      <rect x="-70" y="-50" width="140" height="100" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="1.5"/>
      <text y="-8" font-size="30" fill="#a78bfa">03</text><text y="22" font-size="17" font-weight="700" fill="#fff">MATCH</text><text y="40" font-size="12" fill="#94a3b8">job description</text></g></g>
    <g transform="translate(875,105)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" begin="-2.25s" repeatCount="indefinite"/>
      <rect x="-70" y="-50" width="140" height="100" rx="14" transform="translate(8,10)" fill="#db2777" opacity="0.45"/>
      <rect x="-70" y="-50" width="140" height="100" rx="14" fill="url(#card)" stroke="#f472b6" stroke-width="1.5"/>
      <text y="-8" font-size="30" fill="#f472b6">04</text><text y="22" font-size="17" font-weight="700" fill="#fff">ADVANCE</text><text y="40" font-size="12" fill="#94a3b8">close the gaps</text></g></g>
    <text x="500" y="210" font-size="13" fill="#64748b" letter-spacing="3">UPLOAD · UNDERSTAND · IMPROVE · ADVANCE</text>
  </g>
</svg>
