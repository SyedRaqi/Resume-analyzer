<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Job-fit blend: 65% skill coverage plus 35% text similarity" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#083344"/></linearGradient>
<linearGradient id="c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
<linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#be185d"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
</defs>
<rect width="1000" height="340" rx="18" fill="#070914"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="500" y="34" text-anchor="middle" font-size="13" fill="#64748b" letter-spacing="6">THE JOB-FIT BLEND</text>
<!-- ingredient A -->
<rect x="40" y="56" width="280" height="130" rx="14" transform="translate(8,10)" fill="#22d3ee" opacity="0.25"/>
<rect x="40" y="56" width="280" height="130" rx="14" fill="url(#c1)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="62" y="86" font-size="12" font-weight="700" fill="#67e8f9" letter-spacing="3">INGREDIENT A</text>
<text x="62" y="140" font-size="56" font-weight="900" fill="#fff">65%</text>
<text x="62" y="166" font-size="14" fill="#a5f3fc">skill coverage</text>
<!-- plus -->
<text x="346" y="132" text-anchor="middle" font-size="40" font-weight="900" fill="#a78bfa">+</text>
<!-- ingredient B -->
<rect x="372" y="56" width="280" height="130" rx="14" transform="translate(8,10)" fill="#a78bfa" opacity="0.25"/>
<rect x="372" y="56" width="280" height="130" rx="14" fill="url(#c2)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="394" y="86" font-size="12" font-weight="700" fill="#c4b5fd" letter-spacing="3">INGREDIENT B</text>
<text x="394" y="140" font-size="56" font-weight="900" fill="#fff">35%</text>
<text x="394" y="166" font-size="14" fill="#ddd6fe">text similarity (TF-IDF + cosine)</text>
<!-- equals -->
<text x="678" y="132" text-anchor="middle" font-size="40" font-weight="900" fill="#f472b6">=</text>
<!-- result -->
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3s" repeatCount="indefinite"/>
<rect x="704" y="56" width="256" height="130" rx="14" transform="translate(8,10)" fill="#f472b6" opacity="0.25"/>
<rect x="704" y="56" width="256" height="130" rx="14" fill="url(#c3)" stroke="#f472b6" stroke-width="1.5"/>
<text x="726" y="86" font-size="12" font-weight="700" fill="#fbcfe8" letter-spacing="3">THE RESULT</text>
<text x="726" y="136" font-size="38" font-weight="900" fill="#fff">JOB-FIT</text>
<text x="726" y="166" font-size="14" fill="#fbcfe8">a coaching signal, not a verdict</text></g>
<!-- falling drops -->
<g>
<circle cx="180" cy="196" r="4" fill="#22d3ee"><animate attributeName="cy" values="196;236;196" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></circle>
<circle cx="260" cy="196" r="3" fill="#22d3ee"><animate attributeName="cy" values="196;236;196" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/></circle>
<circle cx="500" cy="196" r="4" fill="#a78bfa"><animate attributeName="cy" values="196;236;196" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/></circle>
<circle cx="580" cy="196" r="3" fill="#a78bfa"><animate attributeName="cy" values="196;236;196" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/></circle>
</g>
<!-- 3D blend bar -->
<rect x="40" y="250" width="920" height="34" rx="8" transform="translate(0,8)" fill="#000" opacity="0.5"/>
<rect x="40" y="250" width="920" height="34" rx="8" fill="#0f172a" stroke="#1e293b"/>
<rect x="40" y="250" width="0" height="34" rx="8" fill="#0891b2">
<animate attributeName="width" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.9;1" values="0;598;598;0"/></rect>
<rect x="40" y="250" width="0" height="10" rx="5" fill="#67e8f9" opacity="0.55">
<animate attributeName="width" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.9;1" values="0;598;598;0"/></rect>
<rect x="40" y="250" width="0" height="34" rx="8" fill="#7c3aed">
<animate attributeName="x" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.4;0.9;1" values="40;638;638;638;40"/>
<animate attributeName="width" dur="8s" repeatCount="indefinite" keyTimes="0;0.25;0.4;0.9;1" values="0;0;322;322;0"/></rect>
<text x="339" y="272" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" opacity="0">SKILLS 65%<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.2;0.25;0.9;1" values="0;0;1;1;0"/></text>
<text x="799" y="272" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" opacity="0">WORDING 35%<animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.38;0.42;0.9;1" values="0;0;1;1;0"/></text>
<text x="500" y="322" text-anchor="middle" font-size="13" fill="#64748b" letter-spacing="3">FIT = 0.65 × SKILLS + 0.35 × WORDING</text>
</g></svg>