<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="SmartHire AI animated 3D banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="0.55" stop-color="#14103a"/><stop offset="1" stop-color="#062a3a"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="6s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#083344"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="topclip"><polygon points="0,-45 78,0 0,45 -78,0"/></clipPath>
    <g id="slab">
      <polygon points="-78,0 0,45 0,59 -78,14" fill="url(#left)"/>
      <polygon points="0,45 78,0 78,14 0,59" fill="url(#right)"/>
      <polygon points="0,-45 78,0 0,45 -78,0" fill="url(#top)" stroke="#e0e7ff" stroke-opacity="0.6" stroke-width="1"/>
    </g>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- perspective floor grid -->
  <g stroke="#6366f1" stroke-opacity="0.35" stroke-width="1" fill="none">
    <g>
      <line x1="600" y1="250" x2="-200" y2="420"/><line x1="600" y1="250" x2="100" y2="420"/><line x1="600" y1="250" x2="400" y2="420"/>
      <line x1="600" y1="250" x2="600" y2="420"/><line x1="600" y1="250" x2="800" y2="420"/><line x1="600" y1="250" x2="1100" y2="420"/><line x1="600" y1="250" x2="1400" y2="420"/>
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
    </g>
    <line x1="0" y1="272" x2="1200" y2="272"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="338" x2="1200" y2="338"/><line x1="0" y1="388" x2="1200" y2="388"/>
  </g>
  <rect x="0" y="250" width="1200" height="170" fill="url(#bg)" opacity="0.25"/>

  <!-- glow behind object -->
  <ellipse cx="930" cy="215" rx="230" ry="170" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ground shadow -->
  <ellipse cx="930" cy="352" rx="95" ry="22" fill="#000" opacity="0.5" filter="url(#blur)">
    <animate attributeName="rx" values="95;78;95" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- floating 3D document layers -->
  <g transform="translate(930,0)">
    <g transform="translate(0,300)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite"/>
      <use href="#slab"/></g></g>
    <g transform="translate(0,238)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
      <use href="#slab" opacity="0.92"/></g></g>
    <g transform="translate(0,176)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -22;0 0" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
      <use href="#slab" opacity="0.95"/>
      <!-- fake resume lines on top face + scan beam -->
      <g clip-path="url(#topclip)">
        <g stroke="#1e1b4b" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
          <line x1="-40" y1="-12" x2="22" y2="19"/><line x1="-26" y1="-19" x2="36" y2="12"/><line x1="-12" y1="-26" x2="50" y2="5"/><line x1="-52" y1="-5" x2="10" y2="26"/>
        </g>
        <rect x="-90" y="-60" width="26" height="120" fill="url(#beam)" transform="skewY(30)">
          <animate attributeName="x" values="-100;100" dur="2.4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <circle cx="0" cy="-58" r="4" fill="#fde047"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <path d="M0 -58 L0 -45" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.7"/>
    </g></g>
  </g>

  <!-- orbiting score chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">
    <g><animateTransform attributeName="transform" type="translate" values="1060 120;1075 100;1060 120" dur="5s" repeatCount="indefinite"/>
      <rect width="92" height="28" rx="14" fill="#0891b2" fill-opacity="0.85"/><text x="46" y="19" text-anchor="middle">SKILLS ✓</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="745 150;730 132;745 150" dur="6s" repeatCount="indefinite"/>
      <rect width="104" height="28" rx="14" fill="#7c3aed" fill-opacity="0.85"/><text x="52" y="19" text-anchor="middle">MATCH 87%</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="1050 285;1066 270;1050 285" dur="7s" repeatCount="indefinite"/>
      <rect width="80" height="28" rx="14" fill="#db2777" fill-opacity="0.85"/><text x="40" y="19" text-anchor="middle">GAPS →</text></g>
  </g>

  <!-- particles -->
  <g fill="#c7d2fe">
    <circle cx="80" cy="60" r="2"><animate attributeName="cy" values="60;30;60" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="360" r="1.6"><animate attributeName="cy" values="360;320;360" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="50" r="2.2"><animate attributeName="cy" values="50;80;50" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="330" r="1.8"><animate attributeName="cy" values="330;300;330" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="60" r="2"><animate attributeName="cy" values="60;90;60" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- extruded 3D title -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="900">
    <g font-size="96" letter-spacing="-2">
      <text x="68" y="206" fill="#1e1b4b">SmartHire AI</text>
      <text x="66" y="204" fill="#312e81">SmartHire AI</text>
      <text x="64" y="202" fill="#4338ca">SmartHire AI</text>
      <text x="62" y="200" fill="#6366f1">SmartHire AI</text>
      <text x="60" y="198" fill="url(#txt)">SmartHire AI</text>
    </g>
    <text x="64" y="244" font-size="20" letter-spacing="7" fill="#a5f3fc" font-weight="700">CAREER INTELLIGENCE. REENGINEERED.</text>
    <text x="64" y="282" font-size="16" fill="#c7d2fe" font-weight="400">Resume intelligence · Job matching · Skill-gap discovery</text>
    <rect x="64" y="304" width="260" height="4" rx="2" fill="#312e81"/>
    <rect x="64" y="304" width="70" height="4" rx="2" fill="url(#txt)">
      <animate attributeName="x" values="64;254;64" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
