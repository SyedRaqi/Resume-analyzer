<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Animated launch sequence: clone, backend, frontend, live" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<radialGradient id="pad"><stop offset="0" stop-color="#6366f1" stop-opacity="0.5"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1000" height="260" rx="18" fill="#070914"/>
<!-- terminal (3D offset shadow) -->
<rect x="38" y="36" width="520" height="190" rx="12" transform="translate(9,10)" fill="#6366f1" opacity="0.35"/>
<rect x="38" y="36" width="520" height="190" rx="12" fill="#0b1020" stroke="#4338ca" stroke-width="1.5"/>
<rect x="38" y="36" width="520" height="30" rx="12" fill="#1e1b4b"/>
<circle cx="60" cy="51" r="5" fill="#f87171"/><circle cx="78" cy="51" r="5" fill="#fbbf24"/><circle cx="96" cy="51" r="5" fill="#4ade80"/>
<g font-family="Consolas, Menlo, 'Courier New', monospace">
<text x="300" y="56" text-anchor="middle" font-size="12" fill="#818cf8">smarthire — launch control</text>
<text x="48" y="120" fill="#94a3b8" font-size="15" opacity="0">$ git clone Resume-analyzer<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.11;0.95;1" values="0;0;1;1;0"/></text>
<text x="48" y="154" fill="#94a3b8" font-size="15" opacity="0">$ uvicorn app.main:app --port 8000<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.3;0.31;0.95;1" values="0;0;1;1;0"/></text>
<text x="48" y="188" fill="#94a3b8" font-size="15" opacity="0">$ npm run dev<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.51;0.95;1" values="0;0;1;1;0"/></text>
<text x="48" y="222" fill="#4ade80" font-size="15" opacity="0">✓ SmartHire AI is live on :5173<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.7;0.71;0.95;1" values="0;0;1;1;0"/></text>

<rect x="48" y="196" width="9" height="16" fill="#a78bfa"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
<!-- launch pad -->
<ellipse cx="760" cy="222" rx="110" ry="20" fill="url(#pad)"/>
<rect x="690" y="218" width="140" height="6" rx="3" fill="#312e81"/>
<!-- rocket -->
<g>
<animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" keyTimes="0;0.88;0.99;1" values="0 0;0 0;0 -150;0 0"/>
<g opacity="1"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.9;0.99;1" values="1;1;0;1"/>
<path d="M760 150 q-16 22 -16 52 h32 q0 -30 -16 -52z" fill="url(#body)"/>
<circle cx="760" cy="176" r="6" fill="#0891b2" stroke="#fff" stroke-width="1.5"/>
<path d="M744 190 l-14 20 l14 -6z M776 190 l14 20 l-14 -6z" fill="#db2777"/>
<path d="M752 204 q8 30 16 0z" fill="#fde047"><animate attributeName="d" values="M752 204 q8 18 16 0z;M752 204 q8 34 16 0z;M752 204 q8 18 16 0z" dur="0.3s" repeatCount="indefinite"/></path>
</g></g>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="760" y="150" text-anchor="middle" font-size="64" font-weight="900" fill="#22d3ee" opacity="0">T-04<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.1;0.101;0.3;0.301;1" values="0;0;1;1;0;0"/></text>
<text x="760" y="150" text-anchor="middle" font-size="64" font-weight="900" fill="#818cf8" opacity="0">T-03<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.3;0.301;0.5;0.501;1" values="0;0;1;1;0;0"/></text>
<text x="760" y="150" text-anchor="middle" font-size="64" font-weight="900" fill="#a78bfa" opacity="0">T-02<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;0.501;0.7;0.701;1" values="0;0;1;1;0;0"/></text>
<text x="760" y="150" text-anchor="middle" font-size="64" font-weight="900" fill="#f472b6" opacity="0">T-01<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.7;0.701;0.9;0.901;1" values="0;0;1;1;0;0"/></text>
<text x="760" y="150" text-anchor="middle" font-size="52" font-weight="900" fill="#fde047" opacity="0">LIFTOFF<animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.9;0.901;0.99;0.991;1" values="0;0;1;1;0;0"/></text>

<text x="760" y="248" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="3">TWO TERMINALS · ONE SMALL STEP</text>
</g>
<!-- progress bar -->
<rect x="38" y="240" width="520" height="4" rx="2" fill="#1e1b4b"/>
<rect x="38" y="240" width="0" height="4" rx="2" fill="url(#bar)"><animate attributeName="width" values="0;520;520" keyTimes="0;0.9;1" dur="10s" repeatCount="indefinite"/></rect>
</svg>